<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Dark Violet Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d1b58"/>
      <stop offset="100%" stop-color="#190926"/>
    </radialGradient>
    
    <!-- Rich Gold Linear Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa820a"/>
      <stop offset="100%" stop-color="#f5d76e"/>
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle Background -->
  <circle cx="120" cy="120" r="110" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="120" cy="120" r="102" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- 5-Point Star -->
  <polygon points="120,18 147,78 212,85 163,129 177,193 120,160 63,193 77,129 28,85 93,78" 
           fill="none" stroke="url(#goldGrad)" stroke-width="5" filter="url(#goldGlow)"/>

  <polygon points="120,28 143,79 198,85 156,122 168,177 120,149 72,177 84,122 42,85 97,79" 
           fill="#250e38" opacity="0.85" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Figure Skater Silhouette (Golden) -->
  <g fill="url(#goldGrad)" transform="translate(120, 118) scale(1.15) translate(-120, -118)">
    <!-- Head -->
    <circle cx="120" cy="65" r="9"/>
    
    <!-- Hair bun -->
    <circle cx="113" cy="62" r="4"/>

    <!-- Torso and Dress Flow -->
    <path d="M 120,74 C 117,85 110,98 106,115 C 108,116 117,118 126,112 C 122,98 123,85 120,74 Z" />
    
    <!-- Dress Skirt Flare -->
    <path d="M 106,113 C 95,116 82,118 72,122 C 85,127 104,125 118,121 C 127,125 138,127 150,125 C 136,119 126,116 116,113 Z" opacity="0.9"/>

    <!-- Arms Extended (Spiral pose) -->
    <!-- Front Arm extended back -->
    <path d="M 118,78 C 100,75 80,72 60,78 C 58,80 62,83 66,82 C 82,78 98,80 115,84 Z"/>
    <!-- Back Arm reaching forward up -->
    <path d="M 122,78 C 135,70 148,60 160,48 C 163,50 161,54 156,58 C 146,68 133,76 124,83 Z"/>

    <!-- Supporting Leg & Quad Skate -->
    <!-- Leg -->
    <path d="M 112,118 C 113,135 114,152 115,170 L 121,170 C 120,152 119,135 118,118 Z"/>
    <!-- Boot -->
    <path d="M 112,170 L 126,170 C 128,174 125,178 111,178 Z"/>
    <!-- Skate Frame & Wheels -->
    <rect x="108" y="178" width="20" height="2" fill="#ffe680"/>
    <circle cx="111" cy="183" r="3" fill="#ffffff" stroke="#aa820a" stroke-width="1"/>
    <circle cx="125" cy="183" r="3" fill="#ffffff" stroke="#aa820a" stroke-width="1"/>

    <!-- Free Leg Extended Back in Spiral -->
    <path d="M 115,116 C 130,122 150,125 172,120 C 174,118 172,114 168,115 C 148,119 130,116 116,110 Z"/>
    <!-- Extended Boot & Skate -->
    <path d="M 170,119 L 178,115 L 180,120 Z"/>
    <!-- Small wheels on extended leg -->
    <circle cx="178" cy="122" r="2" fill="#ffffff"/>
    <circle cx="182" cy="120" r="2" fill="#ffffff"/>
  </g>

  <!-- Decorative Sparkles -->
  <path d="M 50,50 L 53,58 L 61,61 L 53,64 L 50,72 L 47,64 L 39,61 L 47,58 Z" fill="url(#goldGrad)"/>
  <path d="M 190,165 L 192,170 L 197,172 L 192,174 L 190,179 L 188,174 L 183,172 L 188,170 Z" fill="url(#goldGrad)"/>
  <path d="M 195,45 L 196,48 L 199,49 L 196,50 L 195,53 L 194,50 L 191,49 L 194,48 Z" fill="#ffe680"/>
</svg>
